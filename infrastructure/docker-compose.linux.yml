# Linux overlay: adds the device-facing TLS terminator as a container.
#
#     docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
#
# The Makefile selects this automatically on Linux.
#
# WHY THIS IS LINUX ONLY
#
# network_mode: host gives the container the host's network stack directly. No
# port publishing, no NAT, no userland forwarder. The bytes the Sense sends are
# the bytes tlslite-ng sees.
#
# That mode does not meaningfully exist on Docker Desktop for macOS, where
# everything runs inside a Linux VM and traffic reaches a container through a
# userland proxy. This device offers a single cipher, sends no supported_groups,
# and has already been broken twice at the transport layer. Adding a NAT hop in
# front of it for no functional gain is a bad trade, so on macOS sense_server.py
# stays on the host. See README.md.

services:
  sense-server:
    build:
      context: ./sense-server
    image: ${COMPOSE_PROJECT_NAME:-hello-orb}/sense-server:latest
    restart: unless-stopped
    depends_on:
      orb:
        condition: service_healthy
    # The host's :80 and :443, and the host's loopback. That last part is why
    # the upstreams below can say 127.0.0.1: orb publishes 8081 to the host, and
    # with host networking this container shares that loopback.
    network_mode: host
    environment:
      # ORB_EDGE_PORT, never a bind address: this is a URL, so only a bare port
      # is valid here. See the note on orb's ports in docker-compose.yml.
      SENSE_UPSTREAM_SENSE: http://127.0.0.1:${ORB_EDGE_PORT:-8081}
      SENSE_UPSTREAM_TIME: http://127.0.0.1:${ORB_EDGE_PORT:-8081}
      SENSE_UPSTREAM_MESSEJI: http://127.0.0.1:${ORB_EDGE_PORT:-8081}
      # SENSE_SHADOW is deliberately unset. It existed to mirror traffic to
      # suripu-service during the cutover; there is no second implementation to
      # mirror to any more.
      #
      # ACME http-01 webroot. Empty (the default) means the feature is off and
      # this container behaves exactly as it always has. Set it to /acme in
      # .env when a TLS terminator on another port needs a Let's Encrypt
      # certificate: Let's Encrypt only validates http-01 on port 80, and port
      # 80 here belongs to the device. See README, "A certificate for the app
      # API".
      SENSE_ACME_WEBROOT: ${SENSE_ACME_WEBROOT:-}
    volumes:
      # sense_server.py opens "server.crt" and "server.key" relative to its
      # working directory, so they are mounted onto those exact names.
      # See the note on the orb service's mount for why `z` is here.
      - ./secrets/${SENSE_CERT_FILE:-server.crt}:/app/server.crt:ro,z
      - ./secrets/${SENSE_KEY_FILE:-server.key}:/app/server.key:ro,z
      # Where certbot drops http-01 challenge tokens. Mounted read-only and
      # always present, but inert unless SENSE_ACME_WEBROOT points at it.
      - ./acme:/acme:ro,z
